<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>짐 싸기 체크리스트 · 핀란드 여행</title><link rel="stylesheet" href="assets/nordic.css?v=20261102-9"><style>.guide-hero{background:linear-gradient(130deg,#18344a,#47758a);color:white;border-radius:22px;padding:23px;margin:10px 0 16px}.guide-hero h1{margin:0 0 6px;font-size:25px}.guide-hero p{margin:0;color:#e1edf3}.group{background:#fff;border:1px solid #e5eaf0;border-radius:17px;padding:16px;margin:12px 0}.group h2{font-size:17px;margin:0 0 12px}.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #eef1f4}.check:last-child{border:0}.check input{width:18px;height:18px;margin-top:2px;accent-color:#326b83}.check span{line-height:1.45}.muted{font-size:12px;color:#788694}.progress{height:8px;background:#e8edf1;border-radius:9px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:#397d8d;width:0}</style></head><body><main class="wrap"><div class="topbar"><a class="back" href="index.html">← 전체 일정</a></div><header class="guide-hero"><h1>🧳 짐 싸기 체크리스트</h1><p>11월 핀란드 · 헬싱키 / 로바니에미 / 사리셀카</p><div id="count" style="margin-top:13px;font-size:13px">0개 완료</div><div class="progress"><i id="bar"></i></div></header><section class="group"><h2>방한 의류</h2><div data-group="의류"><label class="check"><input type="checkbox"><span>기능성 내의 / 발열 이너 2~3벌</span></label><label class="check"><input type="checkbox"><span>플리스 또는 경량 패딩 중간 보온층</span></label><label class="check"><input type="checkbox"><span>방풍·방수 겨울 외투 또는 보드복</span></label><label class="check"><input type="checkbox"><span>방수·방한 바지 / 보드복 하의</span></label><label class="check"><input type="checkbox"><span>기모 바지와 실내복</span></label><label class="check"><input type="checkbox"><span>두꺼운 양말 여러 켤레</span></label><label class="check"><input type="checkbox"><span>방수 방한 부츠 (미끄럼 방지 밑창)</span></label><label class="check"><input type="checkbox"><span>목도리 또는 넥워머, 비니</span></label><label class="check"><input type="checkbox"><span>방수 장갑 + 얇은 이너 장갑</span></label></div></section><section class="group"><h2>전자기기 & 오로라 촬영</h2><div data-group="전자기기"><label class="check"><input type="checkbox"><span>휴대폰, 충전기, 케이블</span></label><label class="check"><input type="checkbox"><span>보조배터리 (기내 반입 규정 확인)</span></label><label class="check"><input type="checkbox"><span>카메라 / 렌즈 / 여분 배터리</span></label><label class="check"><input type="checkbox"><span>삼각대, 메모리카드</span></label><label class="check"><input type="checkbox"><span>배터리 보온용 파우치</span></label><label class="check"><input type="checkbox"><span>유럽용 어댑터 (C/F 타입 확인)</span></label></div></section><section class="group"><h2>생활·건강·여행 서류</h2><div data-group="생활"><label class="check"><input type="checkbox"><span>여권, 항공권, 숙소·투어 예약 확인서</span></label><label class="check"><input type="checkbox"><span>여행자보험 정보와 비상 연락처</span></label><label class="check"><input type="checkbox"><span>상비약, 개인 복용약</span></label><label class="check"><input type="checkbox"><span>보습크림, 립밤, 선크림</span></label><label class="check"><input type="checkbox"><span>세면도구, 렌즈·안경</span></label><label class="check"><input type="checkbox"><span>수영복 (숙소 사우나·수영장 이용 예정이면)</span></label><label class="check"><input type="checkbox"><span>작은 가방, 물티슈, 지퍼백</span></label><label class="check"><input type="checkbox"><span>핫팩 (항공사 반입·위탁 규정 확인)</span></label></div></section><section class="group"><h2>출발 전 확인</h2><div data-group="출발"><label class="check"><input type="checkbox"><span>여권 유효기간 및 입국 요건 확인</span></label><label class="check"><input type="checkbox"><span>항공사 수하물·보조배터리 규정 확인</span></label><label class="check"><input type="checkbox"><span>오로라 촬영 장비와 카메라 날짜·시간 설정</span></label><label class="check"><input type="checkbox"><span>오프라인 지도와 예약 바우처 저장</span></label></div><p class="muted">체크 상태는 이 기기의 브라우저에 저장돼요.</p></section></main><script>const boxes=[...document.querySelectorAll('input[type=checkbox]')];const key='finland-packing-2026';try{const saved=JSON.parse(localStorage.getItem(key)||'[]');boxes.forEach((b,i)=>b.checked=!!saved[i])}catch(e){}function draw(){const n=boxes.filter(b=>b.checked).length;document.getElementById('count').textContent=n+' / '+boxes.length+'개 완료';document.getElementById('bar').style.width=(n/boxes.length*100)+'%';try{localStorage.setItem(key,JSON.stringify(boxes.map(b=>b.checked)))}catch(e){}}boxes.forEach(b=>b.addEventListener('change',draw));draw();</script><script src="assets/nordic.js?v=20261102-10"></script></body></html>
